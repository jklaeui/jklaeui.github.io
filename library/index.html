<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Library</title>
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e6e3dc;
  --accent: #2f5d8a; --accent-soft: #e8eef5; --mark: #fff0b3; --chip: #f1efe9;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --note-bg: #fbf3dc; --note-line: #d9b44a;
  /* author colours: Paul Tol muted + Okabe-Ito, colour-blind safe */
  --c0: #0072B2; --c1: #E69F00; --c2: #117733; --c3: #CC6677; --c4: #332288; --c5: #44AA99; --c6: #D55E00; --c7: #AA4499; --c8: #999933; --c9: #4FA3D1; --c10: #882255; --c11: #C9B458;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09e97; --line: #33322f;
    --accent: #8db6e0; --accent-soft: #24303c; --mark: #5a4b12; --chip: #2a2a27;
    --shadow: none; --note-bg: #2f2a1c; --note-line: #9c8236;
    --c0: #56B4E9; --c1: #E6A532; --c2: #5BBF6A; --c3: #E08A99; --c4: #968EE6; --c5: #5CC4B3; --c6: #F07A3A; --c7: #CC77BB; --c8: #BDBD55; --c9: #88CCEE; --c10: #D07AA3; --c11: #DDCC77;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09e97; --line: #33322f;
  --accent: #8db6e0; --accent-soft: #24303c; --mark: #5a4b12; --chip: #2a2a27; --shadow: none; --note-bg: #2f2a1c; --note-line: #9c8236;
  --c0: #56B4E9; --c1: #E6A532; --c2: #5BBF6A; --c3: #E08A99; --c4: #968EE6; --c5: #5CC4B3; --c6: #F07A3A; --c7: #CC77BB; --c8: #BDBD55; --c9: #88CCEE; --c10: #D07AA3; --c11: #DDCC77;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* closed sections stay closed even where display is set */
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 12px) 0 10px; border-bottom: 1px solid var(--line);
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13px; }
.tools { display: flex; align-items: center; gap: 6px; }
.iconbtn { display: inline-flex; align-items: center; gap: 3px; min-height: 34px; min-width: 34px; justify-content: center; padding: 4px 8px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.iconbtn:hover, .iconbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
@media (max-width: 420px) { #stats { display: none; } }
.wantmeta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.copied { color: var(--accent) !important; border-color: var(--accent) !important; }
.linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 4px; text-decoration: underline; }
input[type=search] {
  width: 100%; font: inherit; font-size: 17px; padding: 11px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); outline: none;
  -webkit-appearance: none; appearance: none;
}
input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
main { padding: 8px 0 calc(env(safe-area-inset-bottom) + 40px); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.author + .author, .paper + .paper { border-top: 1px solid var(--line); }
.tabs { display: flex; gap: 6px; margin-top: 10px; }
.tabs button { flex: 1; font: inherit; font-size: 15px; padding: 8px 6px; min-height: 40px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); border-color: var(--accent); font-weight: 600; }
.day { font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 14px 4px; background: var(--bg); border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.venue button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.author > button {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  padding: 12px 14px; min-height: 48px;
}
.author > button:hover { background: var(--accent-soft); }
.author .name b { font-weight: 600; }
.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; margin-right: 9px;
  background: var(--c); vertical-align: 0; }
.who { white-space: nowrap; }
.byline .dot { width: 7px; height: 7px; margin-right: 4px; vertical-align: 1px; }
.author > button .name { display: flex; align-items: center; }
.author[aria-expanded="true"] .papers { box-shadow: inset 3px 0 0 var(--c); }
a.pdf { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.count { flex: none; font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 2px 9px; }
.author[aria-expanded="true"] > button { background: var(--accent-soft); }
.chev { flex: none; width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-left: 6px; margin-top: -4px; }
.author[aria-expanded="true"] .chev { transform: rotate(225deg); margin-top: 4px; }
.right { display: flex; align-items: center; gap: 6px; }
.papers { border-top: 1px solid var(--line); background: var(--bg); }
.papers .paper { padding-left: 22px; }
.paper { padding: 9px 14px; }
.title { font-weight: 600; line-height: 1.3; }
/* authors, year and journal on one line */
.byline { font-size: 13.5px; margin-top: 2px; line-height: 1.4; }
.byline button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.byline button:hover { color: var(--accent); }
.venue, .sep { color: var(--muted); }
.actions, .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.pdf, .tog {
  font: inherit; font-size: 13px; border-radius: 7px; padding: 4px 10px; cursor: pointer; min-height: 30px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.tog[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pdf { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pdf:hover { background: var(--accent-soft); }
.pdf small { font-weight: 400; color: var(--muted); }
.pdf.alt { border-color: var(--line); color: var(--text); font-weight: 400; }
.code { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.topics { font-size: 13px; color: var(--muted); margin-top: 5px; }
.topics button { background: var(--chip); border: 0; border-radius: 999px; padding: 2px 9px; margin: 3px 4px 0 0; font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer; text-align: left; }
.abstract { font-size: 14px; color: var(--text); margin-top: 8px; line-height: 1.5; }
.note { font-size: 14px; margin-top: 8px; line-height: 1.5; white-space: pre-wrap; padding: 8px 12px; border-radius: 8px;
  background: var(--note-bg); border-left: 3px solid var(--note-line); }
.notes-toggle { border-color: var(--note-line) !important; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty, .notice { color: var(--muted); padding: 18px 0; }
.login { text-align: center; padding: 18vh 0 0; }
.login p { color: var(--muted); }
.primary { font: inherit; font-weight: 600; background: var(--accent); color: var(--bg); border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; min-height: 48px; }
.more { display: block; width: 100%; padding: 12px; background: none; border: 0; border-top: 1px solid var(--line); color: var(--accent); font: inherit; cursor: pointer; }
@media (min-width: 700px) {
  h1 { font-size: 22px; }
  .paper { padding: 11px 18px; }
  .author > button { padding: 12px 18px; }
  .papers .paper { padding-left: 30px; }
}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="wrap">
    <div class="top">
      <h1>Library</h1>
      <div class="tools"><span class="meta" id="stats"></span>
        <button class="iconbtn" id="fold" title="Library folder" aria-label="Choose library folder"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button class="iconbtn" id="todl" title="To download" aria-label="To-download list"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="todlN"></span></button>
        <button class="iconbtn" id="up" title="Uploads" aria-label="Uploads"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="upN"></span></button>
        <input type="file" id="upfile" accept="application/pdf,.pdf" multiple hidden>
        <button class="linkbtn" id="logout">Log out</button></div>
    </div>
    <input type="search" id="q" placeholder="Search titles, abstracts, authors, journals, topics" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
    <nav class="tabs" role="tablist"><button role="tab" data-tab="authors">Authors</button><button role="tab" data-tab="journals">Journals</button><button role="tab" data-tab="topics">Topics</button><button role="tab" data-tab="recent">Recent</button></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
const APP_KEY = '13d7ztuogqot8nl';
// the library is any folder in the viewer's Dropbox, chosen on the page (folder icon) and remembered
const DEFAULT_ROOT = '/Uni Dropbox/assistant/literature';
let ROOTPATH = '';   // set in start() from localStorage
const indexPath = () => ROOTPATH + '/index.json';
const inboxPath = () => ROOTPATH + '/_inbox';   // uploads; Claude indexes them on request
const REDIRECT = location.origin + location.pathname;
const TOP = {authors: 4, journals: 5, topics: 5};
const TOPIC_TIERS = [30, 10, 5];   // Topics tab: 30+, 10+, 5+, then the rest
const tierOf = n => TOPIC_TIERS.findIndex(t => n >= t);   // this many papers or more: first group of the list

const $ = s => document.querySelector(s);
const main = $('#main');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fold = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();

// ---------- Dropbox auth (OAuth 2 PKCE, no server) ----------

function b64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  store.set('lib-verifier', verifier);
  const p = new URLSearchParams({client_id: APP_KEY, response_type: 'code', code_challenge: challenge,
    code_challenge_method: 'S256', token_access_type: 'offline', redirect_uri: REDIRECT});
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + p;
}
async function tokenRequest(params) {
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {method: 'POST', body: new URLSearchParams({client_id: APP_KEY, ...params})});
  if (!r.ok) throw new Error('token ' + r.status);
  const t = await r.json();
  store.set('lib-access', t.access_token);
  store.set('lib-expires', String(Date.now() + (t.expires_in - 60) * 1000));
  if (t.refresh_token) store.set('lib-refresh', t.refresh_token);
  return t.access_token;
}
async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.get('code')) return;
  history.replaceState(null, '', REDIRECT);
  await tokenRequest({grant_type: 'authorization_code', code: q.get('code'), code_verifier: store.get('lib-verifier') || '', redirect_uri: REDIRECT});
  store.del('lib-verifier');
}
async function token() {
  if (store.get('lib-access') && Date.now() < Number(store.get('lib-expires') || 0)) return store.get('lib-access');
  if (store.get('lib-refresh')) return tokenRequest({grant_type: 'refresh_token', refresh_token: store.get('lib-refresh')});
  return null;
}
async function api(url, opts, retry = true) {
  const t = await token();
  if (!t) throw new Error('login');
  const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: 'Bearer ' + t}});
  if (r.status === 401 && retry) { store.del('lib-access'); return api(url, opts, false); }
  if (!r.ok) {
    // Dropbox explains most errors in user_message (e.g. a missing permission)
    let msg = url.split('/').pop() + ' ' + r.status;
    try { const j = await r.json(); msg = j.user_message?.text || j.error_summary || msg; } catch (e) {}
    if (/required scope|missing_scope/.test(msg)) msg += ' — after enabling it, log out and connect Dropbox again.';
    throw new Error(msg);
  }
  return r;
}
const dbxArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
async function logout() {
  try { await api('https://api.dropboxapi.com/2/auth/token/revoke', {method: 'POST'}); } catch (e) {}
  ['lib-access', 'lib-expires', 'lib-refresh', 'lib-index', 'lib-root'].forEach(store.del);
  location.reload();
}

// ---------- data ----------

let INBOXFILES = [];   // uploaded but not yet indexed
let LIB = null, AUTHORS = [], BYKEY = new Map(), JOURNALS = [], BYJ = new Map();
let TOPICS = [], BYT = new Map();
let tab = ['journals', 'topics', 'recent'].includes(store.get('lib-tab')) ? store.get('lib-tab') : 'authors';

// working-paper series and spelling variants collapse into one entry per journal or series
const SERIES = [[/\bNBER\b|National Bureau of Economic Research/i, 'NBER Working Papers'],
  [/\bIZA\b|Institute of Labor Economics|Institute for the Study of Labor/i, 'IZA Discussion Papers'],
  [/\bCEPR\b/i, 'CEPR Discussion Papers'], [/^CEP\b|Centre for Economic Performance/i, 'CEP Discussion Papers'],
  [/\bSSRN\b/i, 'SSRN'], [/arXiv/i, 'arXiv'], [/CESifo/i, 'CESifo Working Papers'],
  [/Census Bureau|\bCES Working Paper/i, 'Census CES Working Papers'], [/referee/i, 'Referee submissions'],
  [/^(mimeo|working paper|job market paper|draft|unpublished)\b/i, 'Working papers without series'],
  [/Swiss Journal of Economics|schweizerische Statistik und Volkswirtschaft/i, 'Swiss Journal of Economics and Statistics']];
// not peer-reviewed: working-paper series, reports, books, drafts and the rest
const NOT_JOURNAL = /working paper|discussion paper|\bWP\b|\bDP\b|SSRN|arXiv|report|mimeo|draft|press|book|referee|failed download|no venue|^CV$|research paper|policy|preprint|lab\b|institute|bank|university|bureau|\bfed\b|\bHAL\b|Ruhr Economic Papers|SECO|econstor|Economics Series|Randomized Controlled Trials/i;

function venueName(v) {
  v = (v || '').replace(/^The\s+/i, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  for (const [re, name] of SERIES) if (re.test(v)) return name;
  return v.replace(/\s+(No\.?\s*)?\d[\w/.-]*(,.*)?$/i, '').trim() || 'No venue';
}

function authorKey(a) { return fold(a.family).replace(/[^a-z0-9]+/g, ' ').trim() + '|' + fold(a.given).replace(/[^a-z]/g, '').slice(0, 1); }

function prepare(ix) {
  const papers = ix.papers;
  // papers whose author has no given name: attach to the single matching family name, if any
  const byFamily = new Map();
  for (const p of papers) for (const a of p.authors || []) {
    const k = authorKey(a);
    if (!k.endsWith('|')) { const f = k.split('|')[0]; (byFamily.get(f) || byFamily.set(f, new Set()).get(f)).add(k); }
  }
  const map = new Map();
  for (const p of papers) {
    p._search = fold(p.title);
    p._abs = fold(p.abstract);
    p._notes = fold(p.notes);
    p._auth = fold((p.authors || []).map(a => a.given + ' ' + a.family).join(' '));
    const keys = new Set();
    p._akeys = [];
    for (const a of p.authors || []) {
      let k = authorKey(a);
      if (k.endsWith('|')) { const s = byFamily.get(k.slice(0, -1)); if (s && s.size === 1) k = [...s][0]; }
      keys.add(k);
      p._akeys.push(k);
      let e = map.get(k);
      if (!e) map.set(k, e = {key: k, family: a.family, given: a.given || '', papers: []});
      if ((a.given || '').length > e.given.length) e.given = a.given;
    }
    p._keys = [...keys];
    for (const k of keys) map.get(k).papers.push(p);
  }
  const sortName = e => fold(e.family) + ' ' + fold(e.given);
  AUTHORS = [...map.values()].sort((a, b) => sortName(a).localeCompare(sortName(b)));
  for (const e of AUTHORS) e.papers.sort((a, b) => (b.year || 0) - (a.year || 0));
  BYKEY = map;
  const jmap = new Map();
  for (const p of papers) {
    const name = venueName(p.venue), k = fold(name);
    p._jkey = k;
    let e = jmap.get(k);
    if (!e) jmap.set(k, e = {key: k, name, papers: [], wp: NOT_JOURNAL.test(name)});
    e.papers.push(p);
  }
  JOURNALS = [...jmap.values()].sort((a, b) => a.key.localeCompare(b.key));
  for (const e of JOURNALS) e.papers.sort((a, b) => (b.year || 0) - (a.year || 0));
  BYJ = jmap;
  // topics: JEL codes printed in the paper or assigned from title and abstract
  const names = ix.jel_names || {}, short = ix.jel_short || {}, tmap = new Map();
  for (const p of papers) for (const c of p.jel || []) {
    let e = tmap.get(c);
    if (!e) tmap.set(c, e = {key: c, name: short[c] || names[c] || c, official: names[c] || '', papers: []});
    e.papers.push(p);
  }
  TOPICS = [...tmap.values()].sort((a, b) => a.key.localeCompare(b.key));
  for (const e of TOPICS) e.papers.sort((a, b) => (b.year || 0) - (a.year || 0));
  BYT = tmap;
  // colours in turn along each list shown on the page, so neighbours differ
  for (const [list, n] of [[AUTHORS, TOP.authors], [JOURNALS.filter(e => !e.wp), TOP.journals], [JOURNALS.filter(e => e.wp), TOP.journals]]) {
    let top = 0, rest = 0;
    for (const e of list) e.ci = (e.papers.length >= n ? top++ : rest++) % NCOL;
  }
  const tierCount = {};
  for (const e of TOPICS) { const t = tierOf(e.papers.length); tierCount[t] = (tierCount[t] || 0) + 1; e.ci = (tierCount[t] - 1) % NCOL; }
  LIB = ix;
  $('#stats').textContent = `${papers.length} papers · ${AUTHORS.length} authors`;
  $('#todlN').textContent = (ix.wanted || []).length || '';
}

async function dbx(endpoint, body) {
  const r = await api('https://api.dropboxapi.com/2/' + endpoint, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

async function loadIndex() {
  let ix;
  try {
    const r = await api('https://content.dropboxapi.com/2/files/download', {method: 'POST', headers: {'Dropbox-API-Arg': dbxArg({path: indexPath()})}});
    ix = JSON.parse(await r.text());
  } catch (e) {
    if (!/not_found/.test(e.message)) throw e;
    ix = await fileListIndex();   // no index.json in this folder (yet)
  }
  store.set('lib-index', JSON.stringify({root: ROOTPATH, ix}));
  return ix;
}

// without an index: every PDF in the folder by file name, newest first
async function fileListIndex() {
  let res = await dbx('files/list_folder', {path: ROOTPATH, recursive: true, limit: 2000});
  const entries = [...res.entries];
  while (res.has_more) { res = await dbx('files/list_folder/continue', {cursor: res.cursor}); entries.push(...res.entries); }
  const base = ROOTPATH.toLowerCase() + '/';
  const papers = entries.filter(e => e['.tag'] === 'file' && /\.pdf$/i.test(e.name) && !/\/_inbox\//i.test(e.path_lower))
    .map(e => {
      const rel = e.path_display.slice(base.length), day = e.server_modified.slice(0, 10);
      return {id: e.id, title: e.name.replace(/\.pdf$/i, ''), authors: [], year: null, venue: '', abstract: '',
              files: [{path: rel, label: ''}], added: day, last_added: day};
    });
  return {version: 1, simple: true, updated: 'files', papers, wanted: []};
}

// ---------- rendering ----------

// colours are handed out in turn along each alphabetical list, so neighbours always differ
const NCOL = 12;
const colour = e => `var(--c${e?.ci ?? 0})`;
const dot = e => `<span class="dot" style="--c:${colour(e)}" aria-hidden="true"></span>`;
const MAPS = {authors: () => BYKEY, journals: () => BYJ, topics: () => BYT};

// Dropbox web viewer (works when logged in to dropbox.com; opens the Dropbox app on phones)
function viewerUrl(path) {
  const full = ROOTPATH + '/' + path;
  const i = full.lastIndexOf('/');
  const dir = full.slice(0, i).split('/').map(encodeURIComponent).join('/');
  return 'https://www.dropbox.com/home' + dir + '?preview=' + encodeURIComponent(full.slice(i + 1));
}

let terms = [];
function hl(text) {
  let s = esc(text);
  if (!terms.length) return s;
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  // highlight on the folded text so "crepon" also marks "Crépon"
  const plain = String(text ?? ''), f = fold(plain);
  if (f.length !== plain.length) return s.replace(re, '<mark>$1</mark>');
  let out = '', last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(f))) { out += esc(plain.slice(last, m.index)) + '<mark>' + esc(plain.slice(m.index, m.index + m[0].length)) + '</mark>'; last = m.index + m[0].length; }
  return out + esc(plain.slice(last));
}

function paperHtml(p, opts = {}) {
  const authors = (p.authors || []).map((a, i) => `<span class="who">${dot(BYKEY.get(p._akeys[i]))}<button data-author="${esc(p._akeys[i] || '')}">${hl((a.given ? a.given + ' ' : '') + a.family)}</button></span>`).join(', ');
  const venue = [p.year ? esc(p.year) : '', p.venue ? `<button data-journal="${esc(p._jkey)}">${esc(p.venue)}</button>` : ''].filter(Boolean).join(' · ');
  // the main PDF is one click; versions, appendices, abstract, notes and topics open on demand
  const isExtra = f => /appendix|supplement|tables|slides|data|replication/i.test(f.label || '');
  const main = p.files.find(f => !isExtra(f)) || p.files[0];
  const others = p.files.filter(f => f !== main).sort((a, b) => isExtra(a) - isExtra(b));
  const link = (f, text, cls = '') => `<a class="pdf${cls}" href="${esc(viewerUrl(f.path))}" target="_blank" rel="noopener" title="${esc(f.label || '')}">${text}</a>`;
  const tog = (name, label, open, cls = '') => `<button class="tog${cls}" data-toggle="${name}" aria-expanded="${open}">${label}</button>`;
  const topics = (p.jel || []).filter(c => BYT.has(c));
  const noteOpen = !!p.notes && terms.some(t => p._notes.includes(t));
  const actions = link(main, 'PDF')
    + (others.length ? tog('files', `Files (${others.length})`, false) : '')
    + (p.abstract ? tog('abstract', 'Abstract', !!opts.openAbs) : '')
    + (p.notes ? tog('note', 'My notes', noteOpen, ' notes-toggle') : '')
    + (topics.length ? tog('topics', 'Topics', false) : '');
  return `<div class="paper" data-id="${esc(p.id)}">
    <div class="title">${hl(p.title)}</div>
    ${authors || venue ? `<div class="byline">${authors}${authors && venue ? '<span class="sep"> · </span>' : ''}<span class="venue">${venue}</span></div>` : ''}
    <div class="actions">${actions}</div>
    ${others.length ? `<div class="files" hidden>${others.map(f => link(f, esc(f.label || 'Version'), ' alt')).join('')}</div>` : ''}
    ${topics.length ? `<div class="topics" hidden>${topics.map(c => `<button data-topic="${esc(c)}" title="${esc(c + ': ' + BYT.get(c).official)}">${esc(BYT.get(c).name)}</button>`).join('')}</div>` : ''}
    ${p.abstract ? `<div class="abstract" ${opts.openAbs ? '' : 'hidden'}>${hl(p.abstract)}</div>` : ''}
    ${p.notes ? `<div class="note" ${noteOpen ? '' : 'hidden'}>${hl(p.notes)}</div>` : ''}
  </div>`;
}

function rowHtml(kind, e) {
  const name = kind === 'authors' ? `<b>${hl(e.family)}</b>${e.given ? ', ' + hl(e.given) : ''}` : hl(e.name);
  const code = kind === 'topics' ? `<span class="code">${esc(e.key)}</span>` : '';
  const tip = kind === 'topics' && e.official ? ` title="${esc(e.key + ': ' + e.official)}"` : '';
  return `<div class="author" data-kind="${kind}" data-key="${esc(e.key)}" aria-expanded="false" style="--c:${colour(e)}">
    <button${tip}><span class="name">${dot(e)}<span>${name}</span></span><span class="right">${code}<span class="count">${e.papers.length}</span><span class="chev"></span></span></button>
  </div>`;
}
const authorHtml = e => rowHtml('authors', e), journalHtml = e => rowHtml('journals', e), topicHtml = e => rowHtml('topics', e);

function toggleAuthor(el, open) {
  const e = MAPS[el.dataset.kind]().get(el.dataset.key);
  const isOpen = el.getAttribute('aria-expanded') === 'true';
  if (open === undefined) open = !isOpen;
  if (open === isOpen) return;
  el.setAttribute('aria-expanded', String(open));
  if (open) el.insertAdjacentHTML('beforeend', `<div class="papers">${e.papers.map(p => paperHtml(p)).join('')}</div>`);
  else el.querySelector('.papers')?.remove();
}

function renderHome() {
  terms = [];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const n = TOP[tab], html = e => rowHtml(tab, e);
  const last = e => e.key === 'no venue' || e.key === 'failed download';   // always at the end
  const split = list => [list.filter(e => e.papers.length >= n && !last(e)), list.filter(e => e.papers.length < n && !last(e)).concat(list.filter(last))];
  const section = (title, list) => list.length ? `<h2>${title}</h2><div class="list">${list.map(html).join('')}</div>` : '';
  $('#todl').setAttribute('aria-pressed', 'false');
  $('#up').setAttribute('aria-pressed', 'false');
  if (tab === 'recent') return renderRecent();
  if (LIB.simple) {
    main.innerHTML = `<p class="notice">This folder has no index yet, so the page only knows file names (see Recent, or search).
      Authors, journals and topics come with an index built by Claude: <a href="guide.html">how to set it up</a>.</p>`;
    return;
  }
  if (tab === 'authors') {
    const [top, rest] = split(AUTHORS);
    main.innerHTML = section(`${n}+ papers`, top) + section('Other authors', rest);
  } else if (tab === 'topics') {
    const tiers = TOPIC_TIERS.map((t, i) => section(i ? `${t}–${TOPIC_TIERS[i - 1] - 1} papers` : `${t}+ papers`,
      TOPICS.filter(e => tierOf(e.papers.length) === i))).join('');
    const none = LIB.papers.filter(p => !(p.jel || []).length).length;
    main.innerHTML = tiers + section('Other topics', TOPICS.filter(e => tierOf(e.papers.length) === -1))
      + `<p class="notice">Topics are JEL codes, as printed in the paper or assigned from title and abstract.${none ? ` ${none} papers have none yet.` : ''}</p>`;
  } else {
    const [jt, jr] = split(JOURNALS.filter(e => !e.wp)), [wt, wr] = split(JOURNALS.filter(e => e.wp));
    main.innerHTML = section(`Peer-reviewed · ${n}+ papers`, jt) + section(`Working papers &amp; other · ${n}+ papers`, wt)
      + section('Other peer-reviewed journals', jr) + section('Other working papers, reports &amp; books', wr);
  }
}

// Recent: newest first (a paper also moves up when it gets a new version or appendix)
const dayLabel = d => {
  const days = Math.round((new Date(new Date().toDateString()) - new Date(d + 'T00:00:00')) / 864e5);
  return days === 0 ? 'Today' : days === 1 ? 'Yesterday'
    : new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'});
};
function recentHtml(list) {
  let html = '', last = main._lastDay;
  for (const p of list) {
    if (p.last_added !== last) { html += `<div class="day">${esc(dayLabel(p.last_added || ''))}</div>`; last = p.last_added; }
    html += paperHtml(p);
  }
  main._lastDay = last;
  return html;
}
function renderRecent() {
  const noAuthor = p => (p.authors || []).length ? 0 : 1;   // failed downloads etc. at the end of each day
  const list = [...LIB.papers].sort((a, b) => (b.last_added || '').localeCompare(a.last_added || '')
    || noAuthor(a) - noAuthor(b) || fold(a.authors?.[0]?.family).localeCompare(fold(b.authors?.[0]?.family)));
  main._lastDay = null;
  const simpleNote = LIB.simple ? `<p class="notice">No index in this folder yet: files are listed by name and date. <a href="guide.html">Set up an index</a>.</p>` : '';
  main.innerHTML = simpleNote + uploadsHtml() + `<h2>Recently added</h2><div class="list">${recentHtml(list.slice(0, PAGE))}${list.length > PAGE ? '<button class="more" data-more="recent">Show more</button>' : ''}</div>`;
  main._hits = list; main._shown = PAGE;
}

// to-download list: a search string per paper for Google, plus notes kept until the PDF arrives
function renderWanted() {
  terms = [];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
  $('#todl').setAttribute('aria-pressed', 'true');
  $('#up').setAttribute('aria-pressed', 'false');
  const list = LIB.wanted || [];
  const q = w => `"${w.title}" ${w.venue || ''}`.trim();
  main.innerHTML = `<h2>To download · ${list.length}</h2>
    <p class="notice">Download the PDF, upload it with the arrow button above, then tell Claude to update the library.</p>
    <div class="list">${list.map((w, i) => `<div class="paper">
      <div class="title">${esc(w.title)}</div>
      <div class="wantmeta">${esc([w.authors, w.year, w.venue].filter(Boolean).join(' · '))}</div>
      <div class="actions"><button class="pdf copy" data-copy="${esc(q(w))}">Copy</button>
        <a class="pdf alt" href="https://www.google.com/search?q=${encodeURIComponent(q(w))}" target="_blank" rel="noopener">Google</a>
        ${w.notes ? '<button class="tog notes-toggle" data-toggle="note" aria-expanded="false">My notes</button>' : ''}</div>
      ${w.notes ? `<div class="note" hidden>${esc(w.notes)}</div>` : ''}
    </div>`).join('')}</div>`;
  window.scrollTo(0, 0);
}

// files waiting in literature/_inbox (Claude indexes them on request)
async function loadInbox() {
  try {
    const r = await api('https://api.dropboxapi.com/2/files/list_folder', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: inboxPath()})});
    INBOXFILES = (await r.json()).entries.filter(e => e['.tag'] === 'file' && /\.pdf$/i.test(e.name))
      .sort((a, b) => b.server_modified.localeCompare(a.server_modified));
  } catch (e) { INBOXFILES = []; }
  $('#upN').textContent = INBOXFILES.length || '';
}
// Uploads view (upload icon): add PDFs, and see the ones waiting to be indexed
function renderUploads() {
  terms = [];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
  $('#todl').setAttribute('aria-pressed', 'false');
  $('#up').setAttribute('aria-pressed', 'true');
  main.innerHTML = `<h2>Uploads</h2>
    <p><button class="primary" id="pick">Upload PDFs</button></p>
    <div id="upstatus" class="notice" hidden></div>
    ${INBOXFILES.length ? uploadsHtml(`Not yet indexed · ${INBOXFILES.length}`) : '<p class="notice">No uploads waiting. Uploaded PDFs are listed here by file name until you run “Update Library” on the Mac.</p>'}`;
  $('#pick').addEventListener('click', () => $('#upfile').click());
  window.scrollTo(0, 0);
}

function uploadsHtml(heading = 'Uploads · not yet indexed') {
  if (!INBOXFILES.length) return '';
  return `<h2>${heading}</h2><div class="list">${INBOXFILES.map(f => `<div class="paper">
    <div class="title">${esc(f.name)}</div>
    <div class="byline"><span class="venue">uploaded ${esc((d => /^\d/.test(d) ? 'on ' + d : d.toLowerCase())(dayLabel(f.server_modified.slice(0, 10))))}</span></div>
    <div class="actions"><a class="pdf" href="${esc(viewerUrl('_inbox/' + f.name))}" target="_blank" rel="noopener">PDF</a></div>
  </div>`).join('')}</div><p class="notice">Run “Update Library” on the Mac to add these to the library.</p>`;
}

async function upload(files) {
  const pdfs = [...files].filter(f => /\.pdf$/i.test(f.name));
  if (!pdfs.length) return;
  if (!$('#upstatus')) renderUploads();
  const box = $('#upstatus');
  box.hidden = false;
  let ok = 0;
  for (const f of pdfs) {
    box.textContent = `Uploading ${ok + 1} of ${pdfs.length}: ${f.name}…`;
    try {
      await api('https://content.dropboxapi.com/2/files/upload', {method: 'POST', body: f, headers: {
        'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': dbxArg({path: inboxPath() + '/' + f.name, mode: 'add', autorename: true})}});
      ok++;
    } catch (e) {
      box.textContent = `Upload failed for ${f.name}: ${e.message}`;
      return;
    }
  }
  await loadInbox();
  renderUploads();
  $('#upstatus').hidden = false;
  $('#upstatus').textContent = `${ok} PDF${ok > 1 ? 's' : ''} uploaded.`;
}

// folder browser (folder icon): pick the library folder inside your Dropbox
async function renderFolders(path) {
  terms = [];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
  main.innerHTML = '<div class="notice">Loading folders…</div>';
  let folders = [];
  try {
    let res = await dbx('files/list_folder', {path, limit: 2000});
    folders = res.entries.filter(e => e['.tag'] === 'folder');
    while (res.has_more) { res = await dbx('files/list_folder/continue', {cursor: res.cursor}); folders.push(...res.entries.filter(e => e['.tag'] === 'folder')); }
  } catch (e) { main.innerHTML = `<div class="notice">Could not list ${esc(path || 'your Dropbox')} (${esc(e.message)}).</div>`; return; }
  folders.sort((a, b) => a.name.localeCompare(b.name));
  const up = path ? path.slice(0, path.lastIndexOf('/')) : null;
  main.innerHTML = `<h2>Library folder</h2>
    <p class="notice">Current: <b>${esc(ROOTPATH || 'none chosen')}</b>. Open the folder that holds your PDFs and press “Use this folder”.</p>
    <p><button class="primary" data-use="${esc(path)}">Use this folder: ${esc(path || 'Dropbox (top level)')}</button></p>
    <div class="list">
      ${up !== null ? `<div class="author"><button data-open="${esc(up)}"><span class="name">↑ Up to ${esc(up || 'Dropbox')}</span></button></div>` : ''}
      ${folders.map(f => `<div class="author"><button data-open="${esc(f.path_display)}"><span class="name">📁 ${esc(f.name)}</span><span class="chev" style="transform:rotate(-45deg)"></span></button></div>`).join('') || '<div class="paper">No subfolders.</div>'}
    </div>`;
  window.scrollTo(0, 0);
}
async function useFolder(path) {
  ROOTPATH = path;
  store.set('lib-root', path);
  store.del('lib-index');
  main.innerHTML = '<div class="notice">Loading the library…</div>';
  try { prepare(await loadIndex()); } catch (e) { main.innerHTML = `<div class="notice">Could not load the library (${esc(e.message)}).</div>`; return; }
  await loadInbox();
  tab = LIB.simple ? 'recent' : tab;
  renderHome();
}

function showGroup(kind, key) {
  $('#q').value = '';
  tab = kind; store.set('lib-tab', tab);
  renderHome();
  const el = [...main.querySelectorAll('.author')].find(x => x.dataset.key === key);
  if (el) { toggleAuthor(el, true); el.scrollIntoView({block: 'start'}); window.scrollBy(0, -$('#hdr').offsetHeight - 8); }
}

const PAGE = 40;
function renderSearch(q) {
  terms = fold(q).split(/\s+/).filter(Boolean);
  const all = p => terms.every(t => p._search.includes(t) || p._abs.includes(t) || p._auth.includes(t) || p._notes.includes(t));
  const hits = LIB.papers.filter(all);
  // titles first, then authors, then abstract-only; newest first within each tier
  const tier = p => terms.every(t => p._search.includes(t)) ? 0 : terms.every(t => p._search.includes(t) || p._auth.includes(t)) ? 1 : 2;
  hits.sort((a, b) => tier(a) - tier(b) || (b.year || 0) - (a.year || 0));
  const authors = AUTHORS.filter(e => terms.every(t => fold(e.given + ' ' + e.family).includes(t)));
  const journals = JOURNALS.filter(e => terms.every(t => e.key.includes(t)));
  let html = '';
  if (authors.length) html += `<h2>Authors</h2><div class="list">${authors.slice(0, 20).map(authorHtml).join('')}</div>`;
  if (journals.length) html += `<h2>Journals</h2><div class="list">${journals.slice(0, 10).map(journalHtml).join('')}</div>`;
  const topics = TOPICS.filter(e => terms.every(t => fold(e.key + ' ' + e.name + ' ' + e.official).includes(t)));
  if (topics.length) html += `<h2>Topics</h2><div class="list">${topics.slice(0, 10).map(topicHtml).join('')}</div>`;
  html += `<h2>Papers · ${hits.length}</h2>`;
  html += hits.length ? `<div class="list" id="hits">${hits.slice(0, PAGE).map(p => paperHtml(p)).join('')}${hits.length > PAGE ? '<button class="more">Show more</button>' : ''}</div>`
                      : `<div class="empty">Nothing found for “${esc(q)}”.</div>`;
  main.innerHTML = html;
  main._hits = hits; main._shown = PAGE;
  if (authors.length === 1 && !hits.some(p => terms.every(t => p._search.includes(t)))) toggleAuthor(main.querySelector('.author'), true);
}

function alertBox(msg) {
  const d = document.createElement('div');
  d.className = 'notice'; d.textContent = msg;
  main.prepend(d); setTimeout(() => d.remove(), 6000);
}

main.addEventListener('click', ev => {
  const cp = ev.target.closest('[data-copy]');
  if (cp) {
    const done = () => { cp.textContent = 'Copied'; cp.classList.add('copied'); setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('copied'); }, 1500); };
    navigator.clipboard?.writeText(cp.dataset.copy).then(done, () => window.prompt('Copy:', cp.dataset.copy));
    return;
  }
  const tg = ev.target.closest('[data-toggle]');
  if (tg) {
    const box = tg.closest('.paper').querySelector('.' + tg.dataset.toggle);
    box.hidden = !box.hidden; tg.setAttribute('aria-expanded', String(!box.hidden)); return;
  }
  const fo = ev.target.closest('[data-open]');
  if (fo) return renderFolders(fo.dataset.open);
  const fu = ev.target.closest('[data-use]');
  if (fu) return useFolder(fu.dataset.use);
  const jb = ev.target.closest('[data-journal]');
  if (jb) return showGroup('journals', jb.dataset.journal);
  const tb = ev.target.closest('[data-topic]');
  if (tb) return showGroup('topics', tb.dataset.topic);
  const ab = ev.target.closest('[data-author]');
  if (ab && ab.dataset.author) {
    const e = BYKEY.get(ab.dataset.author);
    $('#q').value = (e.given ? e.given + ' ' : '') + e.family;
    renderSearch($('#q').value);
    window.scrollTo(0, 0); return;
  }
  const more = ev.target.closest('.more');
  if (more) {
    const next = main._hits.slice(main._shown, main._shown + PAGE);
    main._shown += PAGE;
    more.insertAdjacentHTML('beforebegin', more.dataset.more === 'recent' ? recentHtml(next) : next.map(p => paperHtml(p)).join(''));
    if (main._shown >= main._hits.length) more.remove();
    return;
  }
  const a = ev.target.closest('.author > button');
  if (a) toggleAuthor(a.parentElement);
});

let timer;
$('#q').addEventListener('input', ev => {
  clearTimeout(timer);
  timer = setTimeout(() => { const q = ev.target.value.trim(); q ? renderSearch(q) : renderHome(); }, 120);
});
$('#logout').addEventListener('click', logout);
$('#fold').addEventListener('click', () => { $('#q').value = ''; renderFolders(ROOTPATH); });
$('#todl').addEventListener('click', () => { $('#q').value = ''; renderWanted(); });
$('#up').addEventListener('click', () => { $('#q').value = ''; renderUploads(); loadInbox().then(() => { if ($('#up').getAttribute('aria-pressed') === 'true') renderUploads(); }); });
$('#upfile').addEventListener('change', ev => { upload(ev.target.files); ev.target.value = ''; });
document.querySelector('.tabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tab]');
  if (!b) return;
  tab = b.dataset.tab; store.set('lib-tab', tab);
  $('#q').value = '';
  renderHome();
  window.scrollTo(0, 0);
});

function showLogin(msg) {
  $('#hdr').hidden = true;
  main.innerHTML = `<div class="login"><p>${esc(msg || 'A private library for the PDFs in your Dropbox.')}</p><button class="primary" id="go">Connect Dropbox</button>
    <p><a href="guide.html">How it works and how to set it up</a></p></div>`;
  $('#go').addEventListener('click', login);
}

(async function start() {
  ROOTPATH = store.get('lib-root') || '';
  // local layout test: http://localhost:8000/library/?local reads a copy of the index next to the page
  if (location.hostname === 'localhost' && new URLSearchParams(location.search).has('local')) {
    $('#hdr').hidden = false;
    ROOTPATH = ROOTPATH || DEFAULT_ROOT;
    prepare(await (await fetch('index.json', {cache: 'no-store'})).json());
    return renderHome();
  }
  try { await handleRedirect(); } catch (e) { return showLogin('Login failed (' + e.message + '). Try again.'); }
  if (!(await token().catch(() => null))) return showLogin();
  $('#hdr').hidden = false;
  if (!ROOTPATH) {
    // first visit: use the default folder if this Dropbox has it, otherwise let the viewer choose
    const meta = await dbx('files/get_metadata', {path: DEFAULT_ROOT}).catch(() => null);
    if (meta && meta['.tag'] === 'folder') { ROOTPATH = DEFAULT_ROOT; store.set('lib-root', ROOTPATH); }
    else return renderFolders('');
  }
  let cached = null;
  try { const c = JSON.parse(store.get('lib-index') || 'null'); if (c && c.root === ROOTPATH) cached = c.ix; } catch (e) {}
  if (cached) { try { prepare(cached); renderHome(); } catch (e) { cached = null; } }
  else main.innerHTML = '<div class="notice">Loading…</div>';
  loadInbox().then(() => { if (tab === 'recent' && LIB && !$('#q').value.trim()) renderRecent(); });
  try {
    const ix = await loadIndex();
    const q = $('#q').value.trim();
    if (!cached || ix.updated !== LIB?.updated || ix.simple) {
      prepare(ix);
      if (ix.simple && tab !== 'recent') tab = 'recent';
      q ? renderSearch(q) : renderHome();
    }
  } catch (e) {
    if (e.message === 'login') return showLogin();
    if (!cached) main.innerHTML = `<div class="notice">Could not load the index (${esc(e.message)}).</div>`;
  }
})();
</script>
</body>
